{% extends "accounts/base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h3 class="mt-4 mb-3">{{ title }}</h3>
<div class="row g-4"><div class="col-md-5"><div class="card card-custom"><div class="card-body">
<h5>เพิ่ม / แก้ไข</h5><form method="post" class="mt-3">{% csrf_token %}{{ form.as_p }}<input type="hidden" name="id" id="item-id"><button class="btn btn-primary">➕ เพิ่ม / บันทึก</button></form>
</div></div></div>
<div class="col-md-7"><div class="table-responsive table-custom"><table class="table align-middle mb-0"><thead><tr><th>ID</th><th>ข้อมูล</th><th>จัดการ</th></tr></thead><tbody>
{% for item in items %}<tr><td>{{ item.id }}</td><td>{{ item }}</td><td><form method="post" action="{% if title == 'จัดการสถานี' %}{% url 'delete_item' 'station' item.id %}{% elif title == 'จัดการขบวนรถไฟ' %}{% url 'delete_item' 'train' item.id %}{% elif title == 'จัดการชั้นโดยสาร' %}{% url 'delete_item' 'class' item.id %}{% else %}{% url 'delete_item' 'schedule' item.id %}{% endif %}">{% csrf_token %}<button class="btn btn-sm btn-outline-danger">🗑️ ลบ</button></form></td></tr>
{% empty %}<tr><td colspan="3" class="text-center">ยังไม่มีข้อมูล</td></tr>{% endfor %}</tbody></table></div></div></div>
{% endblock %}
