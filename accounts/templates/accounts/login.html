<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; display: grid; place-items: center; min-height: 100vh; }
        .card { background: #fff; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 30px 40px; width: min(480px, 90vw); }
        form { display: flex; flex-direction: column; }
        label { margin-top: 12px; font-weight: bold; }
        input { padding: 10px; margin-top: 6px; border: 1px solid #cdd4da; border-radius: 8px; }
        button { margin-top: 20px; padding: 12px; border: none; border-radius: 8px; background: #1f7a8c; color: white; cursor: pointer; }
        a { color: #1f7a8c; text-decoration: none; }
        .errorlist { color: #b00020; margin: 8px 0; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Login</h2>
        {% if messages %}
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        {% endif %}
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Login</button>
        </form>
        <p>Need an account? <a href="{% url 'signup' %}">Sign Up</a></p>
    </div>
</body>
</html>
